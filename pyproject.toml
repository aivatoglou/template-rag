[project]
name = "rag-agentic-assistant"
version = "0.1.0"
description = "A simple RAG agentic assistant using tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.4.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "openai>=1.50.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
